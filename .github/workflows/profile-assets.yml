name: Build profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  build-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: 8dazo/portfolio
          path: portfolio-src

      - name: Build the actual portfolio street animation
        run: node scripts/build-portfolio-street.mjs

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%23C77E0A
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23F3B44A

      - name: Record selected-project star history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-star-history.mjs

      - name: Commit generated assets
        run: |
          rm -rf portfolio-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then
            echo "No generated asset changes"
            exit 0
          fi
          git commit -m "chore: refresh profile animations"
          git push
