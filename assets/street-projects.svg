<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Devansh Mahant — selected projects</title>
  <desc id="desc">A portfolio-inspired animated street scene with a walking character and rotating project names.</desc>
